name: Deploy RabbitMQ

on:
  workflow_dispatch:
    inputs:
      rabbitmq_instance_tag:
        description: "EC2 Name tag for RabbitMQ server"
        required: true
        default: "rabbitmq"
        type: string
      rabbitmq_admin_secret_id:
        description: "Secrets Manager secret id/arn for RabbitMQ admin credentials"
        required: true
        default: "oplust/dev/rabbitmq/admin-credentials"
        type: string
      rabbitmq_app_secret_id:
        description: "Secrets Manager secret id/arn for RabbitMQ app credentials"
        required: true
        default: "oplust/dev/rabbitmq/credentials"
        type: string
      rabbitmq_vhost:
        description: "RabbitMQ vhost"
        required: true
        default: "/"
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy-rabbitmq:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync RabbitMQ users from Secrets Manager via SSM
        env:
          INSTANCE_TAG: ${{ github.event.inputs.rabbitmq_instance_tag }}
          RABBITMQ_ADMIN_SECRET_ID: ${{ github.event.inputs.rabbitmq_admin_secret_id }}
          RABBITMQ_APP_SECRET_ID: ${{ github.event.inputs.rabbitmq_app_secret_id }}
          RABBITMQ_VHOST: ${{ github.event.inputs.rabbitmq_vhost }}
        run: |
          set -euo pipefail

          if [[ "$RABBITMQ_VHOST" == *"'"* ]] || [[ "$RABBITMQ_VHOST" == *$'\n'* ]] || [[ "$RABBITMQ_VHOST" == *$'\r'* ]]; then
            echo "Invalid rabbitmq_vhost input. Single quote and newlines are not allowed." >&2
            exit 1
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${INSTANCE_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running RabbitMQ instance found for tag: $INSTANCE_TAG" >&2
            exit 1
          fi

          PARAMS=$(jq -nc \
            --arg c1 "set -euo pipefail" \
            --arg c2 "command -v jq >/dev/null 2>&1 || sudo dnf -y install jq" \
            --arg c3 "command -v aws >/dev/null 2>&1 || sudo dnf -y install awscli" \
            --arg c4 "sudo systemctl enable --now rabbitmq-server" \
            --arg c5 "sudo rabbitmq-plugins enable rabbitmq_management" \
            --arg c6 "ADMIN_JSON=\$(aws secretsmanager get-secret-value --region $AWS_REGION --secret-id '${RABBITMQ_ADMIN_SECRET_ID}' --query SecretString --output text)" \
            --arg c7 "APP_JSON=\$(aws secretsmanager get-secret-value --region $AWS_REGION --secret-id '${RABBITMQ_APP_SECRET_ID}' --query SecretString --output text)" \
            --arg c8 "ADMIN_USER=\$(echo \"\$ADMIN_JSON\" | jq -r '.username')" \
            --arg c9 "ADMIN_PASS=\$(echo \"\$ADMIN_JSON\" | jq -r '.password')" \
            --arg c10 "APP_USER=\$(echo \"\$APP_JSON\" | jq -r '.username')" \
            --arg c11 "APP_PASS=\$(echo \"\$APP_JSON\" | jq -r '.password')" \
            --arg c12 "if [ -z \"\$ADMIN_USER\" ] || [ \"\$ADMIN_USER\" = \"null\" ] || [ -z \"\$ADMIN_PASS\" ] || [ \"\$ADMIN_PASS\" = \"null\" ] || [ -z \"\$APP_USER\" ] || [ \"\$APP_USER\" = \"null\" ] || [ -z \"\$APP_PASS\" ] || [ \"\$APP_PASS\" = \"null\" ]; then echo 'Secret payload invalid (username/password missing)' >&2; exit 1; fi" \
            --arg c13 "if sudo rabbitmqctl list_users | awk '{print \$1}' | grep -qx \"\$ADMIN_USER\"; then sudo rabbitmqctl change_password \"\$ADMIN_USER\" \"\$ADMIN_PASS\"; else sudo rabbitmqctl add_user \"\$ADMIN_USER\" \"\$ADMIN_PASS\"; fi" \
            --arg c14 "sudo rabbitmqctl set_user_tags \"\$ADMIN_USER\" administrator" \
            --arg c15 "sudo rabbitmqctl set_permissions -p '${RABBITMQ_VHOST}' \"\$ADMIN_USER\" '.*' '.*' '.*'" \
            --arg c16 "if sudo rabbitmqctl list_users | awk '{print \$1}' | grep -qx \"\$APP_USER\"; then sudo rabbitmqctl change_password \"\$APP_USER\" \"\$APP_PASS\"; else sudo rabbitmqctl add_user \"\$APP_USER\" \"\$APP_PASS\"; fi" \
            --arg c17 "sudo rabbitmqctl set_user_tags \"\$APP_USER\" management" \
            --arg c18 "sudo rabbitmqctl set_permissions -p '${RABBITMQ_VHOST}' \"\$APP_USER\" '.*' '.*' '.*'" \
            --arg c19 "if sudo rabbitmqctl list_users | awk '{print \$1}' | grep -qx guest; then sudo rabbitmqctl delete_user guest || true; fi" \
            --arg c20 "sudo rabbitmq-diagnostics -q ping" \
            '{commands:[$c1,$c2,$c3,$c4,$c5,$c6,$c7,$c8,$c9,$c10,$c11,$c12,$c13,$c14,$c15,$c16,$c17,$c18,$c19,$c20]}')

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Sync RabbitMQ users from Secrets Manager" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$CMD_ID instance_id=$INSTANCE_ID"

          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "RabbitMQ sync success"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "RabbitMQ sync failed: $STATUS" >&2
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{StdOut:StandardOutputContent,StdErr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "RabbitMQ sync timed out" >&2
          exit 1
