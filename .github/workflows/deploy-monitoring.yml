name: Deploy Monitoring Stack

on:
  workflow_dispatch:
    inputs:
      monitoring_instance_tag:
        description: "EC2 Name tag for monitoring server"
        required: true
        default: "monitoring"
        type: string
      project_name:
        description: "Project name"
        required: true
        default: "oplust"
        type: string
      environment:
        description: "Environment name"
        required: true
        default: "dev"
        type: string
      grafana_admin_secret_id:
        description: "Secrets Manager secret id/arn for Grafana admin credentials"
        required: true
        default: "oplust/dev/monitoring/grafana-admin-credentials"
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  MONITORING_ROOT: /opt/oplust-monitoring

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve targets from Terraform naming convention
        env:
          PROJECT_NAME: ${{ github.event.inputs.project_name }}
          ENV_NAME: ${{ github.event.inputs.environment }}
          INSTANCE_TAG: ${{ github.event.inputs.monitoring_instance_tag }}
        run: |
          set -euo pipefail

          get_private_ip_by_name() {
            local name_tag="$1"
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters "Name=tag:Name,Values=${name_tag}" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PrivateIpAddress" \
              --output text
          }

          USER_API_IP=$(get_private_ip_by_name "user")
          ADMIN_API_IP=$(get_private_ip_by_name "admin")
          MONITORING_IP=$(get_private_ip_by_name "${INSTANCE_TAG}")

          if [ -z "$USER_API_IP" ] || [ "$USER_API_IP" = "None" ] || [ -z "$ADMIN_API_IP" ] || [ "$ADMIN_API_IP" = "None" ] || [ -z "$MONITORING_IP" ] || [ "$MONITORING_IP" = "None" ]; then
            echo "Failed to resolve required EC2 private IPs (user/admin/monitoring)." >&2
            exit 1
          fi

          USER_API_TARGET="${USER_API_IP}:8080"
          ADMIN_API_TARGET="${ADMIN_API_IP}:8081"
          MACHINE_NODE_EXPORTER_TARGET="${MONITORING_IP}:9100"

          NODE_EXPORTER_TARGETS_YAML="\"${USER_API_IP}:9100\",\"${ADMIN_API_IP}:9100\",\"${MONITORING_IP}:9100\""

          ECS_CLUSTER_PARAM="/${PROJECT_NAME}/${ENV_NAME}/lambda/worker/ecs_cluster_name"
          ECS_SERVICE_PARAM="/${PROJECT_NAME}/${ENV_NAME}/lambda/worker/ecs_service_name"

          ECS_CLUSTER_NAME=$(aws ssm get-parameter --region "$AWS_REGION" --name "$ECS_CLUSTER_PARAM" --with-decryption --query 'Parameter.Value' --output text)
          ECS_SERVICE_NAME=$(aws ssm get-parameter --region "$AWS_REGION" --name "$ECS_SERVICE_PARAM" --with-decryption --query 'Parameter.Value' --output text)

          if [ -z "$ECS_CLUSTER_NAME" ] || [ "$ECS_CLUSTER_NAME" = "None" ] || [ -z "$ECS_SERVICE_NAME" ] || [ "$ECS_SERVICE_NAME" = "None" ]; then
            echo "Failed to resolve ECS cluster/service from SSM." >&2
            exit 1
          fi

          TASK_ARNS=$(aws ecs list-tasks --region "$AWS_REGION" --cluster "$ECS_CLUSTER_NAME" --service-name "$ECS_SERVICE_NAME" --desired-status RUNNING --query 'taskArns' --output text || true)
          TRANSCODER_TARGETS_YAML=""

          if [ -n "${TASK_ARNS:-}" ]; then
            ENI_IDS=$(aws ecs describe-tasks --region "$AWS_REGION" --cluster "$ECS_CLUSTER_NAME" --tasks $TASK_ARNS \
              --query 'tasks[].attachments[].details[?name==`networkInterfaceId`].value' --output text || true)

            if [ -n "${ENI_IDS:-}" ]; then
              TRANSCODER_IPS=$(aws ec2 describe-network-interfaces --region "$AWS_REGION" --network-interface-ids $ENI_IDS \
                --query 'NetworkInterfaces[].PrivateIpAddress' --output text || true)
              if [ -n "${TRANSCODER_IPS:-}" ]; then
                TRANSCODER_TARGETS_YAML=$(printf '%s\n' $TRANSCODER_IPS | sed '/^$/d' | sort -u | awk '{printf "\"%s:8080\",", $0}' | sed 's/,$//')
              fi
            fi
          fi

          echo "USER_API_TARGET=$USER_API_TARGET" >> "$GITHUB_ENV"
          echo "ADMIN_API_TARGET=$ADMIN_API_TARGET" >> "$GITHUB_ENV"
          echo "TRANSCODER_TARGETS_YAML=$TRANSCODER_TARGETS_YAML" >> "$GITHUB_ENV"
          echo "NODE_EXPORTER_TARGETS_YAML=$NODE_EXPORTER_TARGETS_YAML" >> "$GITHUB_ENV"
          echo "MACHINE_NODE_EXPORTER_TARGET=$MACHINE_NODE_EXPORTER_TARGET" >> "$GITHUB_ENV"

      - name: Render prod Prometheus config
        run: |
          set -euo pipefail

          sed \
            -e "s|__USER_API_TARGET__|${USER_API_TARGET}|g" \
            -e "s|__ADMIN_API_TARGET__|${ADMIN_API_TARGET}|g" \
            -e "s|__TRANSCODER_TARGETS__|${TRANSCODER_TARGETS_YAML}|g" \
            -e "s|__NODE_EXPORTER_TARGETS__|${NODE_EXPORTER_TARGETS_YAML}|g" \
            -e "s|__MACHINE_NODE_EXPORTER_TARGET__|${MACHINE_NODE_EXPORTER_TARGET}|g" \
            apps/monitoring/prometheus/prometheus.prod.yml.tpl > apps/monitoring/prometheus/prometheus.prod.yml

      - name: Resolve Grafana admin password from Secrets Manager
        env:
          GRAFANA_ADMIN_SECRET_ID: ${{ github.event.inputs.grafana_admin_secret_id }}
        run: |
          set -euo pipefail

          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$GRAFANA_ADMIN_SECRET_ID" \
            --query 'SecretString' \
            --output text)

          GRAFANA_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.password')

          if [ -z "$GRAFANA_PASSWORD" ] || [ "$GRAFANA_PASSWORD" = "null" ]; then
            echo "Grafana admin password is empty in secret: $GRAFANA_ADMIN_SECRET_ID" >&2
            exit 1
          fi

          echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD" >> "$GITHUB_ENV"

      - name: Deploy monitoring stack via SSM
        env:
          INSTANCE_TAG: ${{ github.event.inputs.monitoring_instance_tag }}
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${INSTANCE_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running monitoring instance found for tag: $INSTANCE_TAG" >&2
            exit 1
          fi

          COMPOSE_B64=$(base64 -w 0 apps/monitoring/docker-compose.yml)
          COMPOSE_PROD_B64=$(base64 -w 0 apps/monitoring/docker-compose.prod.yml)
          PROM_PROD_B64=$(base64 -w 0 apps/monitoring/prometheus/prometheus.prod.yml)
          LOKI_B64=$(base64 -w 0 apps/monitoring/loki/loki.yml)
          DATASOURCE_B64=$(base64 -w 0 apps/monitoring/grafana/provisioning/datasources/prometheus.yml)
          DASH_PROVIDER_B64=$(base64 -w 0 apps/monitoring/grafana/provisioning/dashboards/dashboards.yml)
          DASHBOARDS_JSON_TGZ_B64=$(tar -C apps/monitoring/grafana/provisioning/dashboards -czf - json | base64 -w 0)

          PARAMS=$(jq -nc \
            --arg c1 "set -euo pipefail" \
            --arg c2 "sudo mkdir -p ${MONITORING_ROOT}/prometheus ${MONITORING_ROOT}/loki ${MONITORING_ROOT}/grafana/provisioning/datasources ${MONITORING_ROOT}/grafana/provisioning/dashboards/json ${MONITORING_ROOT}/grafana/provisioning/dashboards" \
            --arg c3 "echo '$COMPOSE_B64' | base64 -d | sudo tee ${MONITORING_ROOT}/docker-compose.yml >/dev/null" \
            --arg c4 "echo '$COMPOSE_PROD_B64' | base64 -d | sudo tee ${MONITORING_ROOT}/docker-compose.prod.yml >/dev/null" \
            --arg c5 "echo '$PROM_PROD_B64' | base64 -d | sudo tee ${MONITORING_ROOT}/prometheus/prometheus.prod.yml >/dev/null" \
            --arg c6 "echo '$DATASOURCE_B64' | base64 -d | sudo tee ${MONITORING_ROOT}/grafana/provisioning/datasources/prometheus.yml >/dev/null" \
            --arg c6a "echo '$LOKI_B64' | base64 -d | sudo tee ${MONITORING_ROOT}/loki/loki.yml >/dev/null" \
            --arg c7 "echo '$DASH_PROVIDER_B64' | base64 -d | sudo tee ${MONITORING_ROOT}/grafana/provisioning/dashboards/dashboards.yml >/dev/null" \
            --arg c8 "echo '$DASHBOARDS_JSON_TGZ_B64' | base64 -d | sudo tar -xzf - -C ${MONITORING_ROOT}/grafana/provisioning/dashboards" \
            --arg c9 "printf '%s\n' 'GF_SECURITY_ADMIN_USER=admin' 'GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}' | sudo tee ${MONITORING_ROOT}/.env >/dev/null" \
            --arg c10 "if sudo docker compose version >/dev/null 2>&1; then COMPOSE_CMD='sudo docker compose'; elif sudo docker-compose version >/dev/null 2>&1; then COMPOSE_CMD='sudo docker-compose'; else if command -v dnf >/dev/null 2>&1; then sudo dnf install -y docker-compose-plugin || true; fi; if command -v yum >/dev/null 2>&1; then sudo yum install -y docker-compose-plugin || true; fi; if sudo docker compose version >/dev/null 2>&1; then COMPOSE_CMD='sudo docker compose'; elif sudo docker-compose version >/dev/null 2>&1; then COMPOSE_CMD='sudo docker-compose'; else sudo mkdir -p /usr/local/lib/docker/cli-plugins; sudo curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose; sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose; if sudo docker compose version >/dev/null 2>&1; then COMPOSE_CMD='sudo docker compose'; else echo 'Docker Compose not found' >&2; exit 1; fi; fi; fi" \
            --arg c11 "if ! sudo docker network inspect backend_default >/dev/null 2>&1; then sudo docker network create backend_default; fi" \
            --arg c12 "cd ${MONITORING_ROOT} && \$COMPOSE_CMD -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d" \
            '{commands:[$c1,$c2,$c3,$c4,$c5,$c6,$c6a,$c7,$c8,$c9,$c10,$c11,$c12]}')

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy monitoring stack" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$CMD_ID instance_id=$INSTANCE_ID"

          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "Monitoring deployment success"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Monitoring deployment failed: $STATUS" >&2
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{StdOut:StandardOutputContent,StdErr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Monitoring deployment timed out" >&2
          exit 1
